name: Build Android APK and Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate Android project files (first run only)
        shell: bash
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/pubspec.yaml
            cp -r lib /tmp/lib_backup
            flutter create --project-name samosa_pos --org com.bismillah.samosa --platforms=android .
            cp /tmp/pubspec.yaml pubspec.yaml
            rm -rf lib && cp -r /tmp/lib_backup lib
            rm -rf test
          fi
          sed -i 's/android:label="[^"]*"/android:label="Samosa POS"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q BLUETOOTH_CONNECT android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          fi

      - name: Configure release signing (if secrets exist)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            python3 ci/patch_signing.py
          else
            echo "No keystore secrets found: building a debug-signed APK"
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SamosaPOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SamosaPOS-Android-APK
          path: SamosaPOS.apk

  windows:
    name: Windows EXE
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate Windows project files (first run only)
        shell: bash
        run: |
          if [ ! -d windows ]; then
            cp pubspec.yaml /tmp/pubspec.yaml
            cp -r lib /tmp/lib_backup
            flutter create --project-name samosa_pos --org com.bismillah.samosa --platforms=windows .
            cp /tmp/pubspec.yaml pubspec.yaml
            rm -rf lib && cp -r /tmp/lib_backup lib
            rm -rf test
          fi

      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}

      - name: Zip the Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath SamosaPOS-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SamosaPOS-Windows-EXE
          path: SamosaPOS-Windows.zip

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SamosaPOS.apk
            dist/SamosaPOS-Windows.zip
