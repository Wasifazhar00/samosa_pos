name: Build Android APK and Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate Android project files (first run only)
        shell: bash
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/pubspec.yaml
            cp -r lib /tmp/lib_backup
            flutter create --project-name samosa_pos --org com.bismillah.samosa --platforms=android .
            cp /tmp/pubspec.yaml pubspec.yaml
            rm -rf lib && cp -r /tmp/lib_backup lib
            rm -rf test
          fi
          sed -i 's/android:label="[^"]*"/android:label="Samosa POS"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SamosaPOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SamosaPOS-Android-APK
          path: SamosaPOS.apk

  windows:
    name: Windows EXE
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate Windows project files (first run only)
        shell: bash
        run: |
          if [ ! -d windows ]; then
            cp pubspec.yaml /tmp/pubspec.yaml
            cp -r lib /tmp/lib_backup
            flutter create --project-name samosa_pos --org com.bismillah.samosa --platforms=windows .
            cp /tmp/pubspec.yaml pubspec.yaml
            rm -rf lib && cp -r /tmp/lib_backup lib
            rm -rf test
          fi

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip the Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath SamosaPOS-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SamosaPOS-Windows-EXE
          path: SamosaPOS-Windows.zip

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SamosaPOS.apk
            dist/SamosaPOS-Windows.zip
